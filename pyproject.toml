[project]
name = "apkscanner"
version = "0.1.0"
description = "Static analysis tool designed for parsing, auditing, and evaluating security configurations of Android applications."
requires-python = ">=3.12,<3.13"
dependencies = [
    "androguard",
    "beautifulsoup4",
    "instructor",
    "json-repair",
    "loguru",
    "markdown-pdf",
    "openai",
    "requests",
    "sqlmodel",
    "tqdm",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "vulture",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vulture_whitelist.py"]


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror the signature of the callable they stand in for, so accepting an
# argument without reading it is intentional there rather than a sign of dead code.
"tests/**" = ["ARG"]

[tool.vulture]
paths = ["main.py", "scanner", "vulture_whitelist.py"]



